{{define "title"}}Connexion — EptaAdmin{{end}}
{{define "content"}}
<div class="min-h-full flex items-center justify-center px-4">
  <div class="w-full max-w-sm eb-card rounded-2xl p-8">
    <div class="text-center mb-8">
      <img src="/static/logo-icon.png" alt="EptaAdmin" class="mx-auto h-12 w-12 rounded-xl" />
      <h1 class="mt-4 text-xl font-semibold" style="color: var(--eb-text);">Connexion</h1>
      <p class="text-sm mt-1" style="color: var(--eb-muted);">Accédez à votre espace EptaAdmin</p>
    </div>

    {{if .Error}}
    <div class="mb-4 rounded-lg text-sm px-4 py-3" style="background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #fca5a5;">
      {{.Error}}
    </div>
    {{end}}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1" style="color: var(--eb-muted);" for="username">Identifiant</label>
        <input id="username" name="username" type="text" required autofocus
          class="eb-input w-full rounded-lg px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" style="color: var(--eb-muted);" for="password">Mot de passe</label>
        <input id="password" name="password" type="password" required
          class="eb-input w-full rounded-lg px-3 py-2 text-sm" />
      </div>
      <button type="submit"
        class="eb-btn-primary w-full rounded-lg text-sm py-2.5 transition-colors">
        Se connecter
      </button>
    </form>

    <p class="mt-6 text-center text-sm" style="color: var(--eb-muted);">
      Pas encore de compte ?
      <a href="/register" class="font-medium hover:underline" style="color: var(--eb-accent);">Créer un compte</a>
    </p>
  </div>
</div>
{{end}}
{{template "layout" .}}
