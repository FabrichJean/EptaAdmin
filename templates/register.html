{{define "title"}}Créer un compte — EptaAdmin{{end}}
{{define "content"}}
<div class="min-h-full flex items-center justify-center px-4">
  <div class="w-full max-w-sm eb-card rounded-2xl p-8">
    <div class="text-center mb-8">
      <div class="mx-auto h-12 w-12 rounded-xl flex items-center justify-center font-bold text-xl" style="background: var(--eb-accent); color: var(--eb-accent-ink);">E</div>
      <h1 class="mt-4 text-xl font-semibold" style="color: var(--eb-text);">Configuration initiale</h1>
      <p class="text-sm mt-1" style="color: var(--eb-muted);">Ce formulaire crée le compte Propriétaire. Il ne sera plus accessible ensuite.</p>
    </div>

    {{if .Error}}
    <div class="mb-4 rounded-lg text-sm px-4 py-3" style="background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #fca5a5;">
      {{.Error}}
    </div>
    {{end}}

    <form method="POST" action="/register" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1" style="color: var(--eb-muted);" for="username">Identifiant</label>
        <input id="username" name="username" type="text" required autofocus value="{{.Username}}"
          class="eb-input w-full rounded-lg px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" style="color: var(--eb-muted);" for="email">Email</label>
        <input id="email" name="email" type="email" required value="{{.Email}}"
          class="eb-input w-full rounded-lg px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" style="color: var(--eb-muted);" for="password">Mot de passe</label>
        <input id="password" name="password" type="password" required minlength="8"
          class="eb-input w-full rounded-lg px-3 py-2 text-sm" />
        <p class="mt-1 text-xs" style="color: var(--eb-muted);">8 caractères minimum</p>
      </div>
      <button type="submit"
        class="eb-btn-primary w-full rounded-lg text-sm py-2.5 transition-colors">
        Créer mon compte
      </button>
    </form>

    <p class="mt-6 text-center text-sm" style="color: var(--eb-muted);">
      Déjà inscrit ?
      <a href="/login" class="font-medium hover:underline" style="color: var(--eb-accent);">Se connecter</a>
    </p>
  </div>
</div>
{{end}}
{{template "layout" .}}
