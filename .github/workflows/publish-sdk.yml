name: Publish SDK to npm

on:
  push:
    branches: [main]
    paths:
      - "sdk/js/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Validate package loads
        working-directory: sdk/js
        run: node --input-type=module -e "import('./src/index.js').then(() => console.log('SDK module loads OK'))"

      - name: Bump version
        id: bump
        working-directory: sdk/js
        run: |
          npm version "${{ github.event.inputs.bump || 'patch' }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sdk/js/package.json
          git commit -m "chore(sdk): release eptaadmin-sdk v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "sdk-v${{ steps.bump.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "sdk-v${{ steps.bump.outputs.version }}"

      - name: Publish to npm
        working-directory: sdk/js
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
